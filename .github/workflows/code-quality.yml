name: Code Quality & Linting

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '.github/workflows/code-quality.yml'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/code-quality.yml'

      # Same versions as scripts/setup_env.py installs
      - name: Install linting tools
        run: pip install black==25.1.0 ruff==0.15.12 isort==8.0.1

      - name: Check code formatting with Black
        id: black
        continue-on-error: true
        run: black --check --diff geofuse/ tests/ scripts/ ui/

      - name: Check import sorting with isort
        id: isort
        continue-on-error: true
        run: isort --check-only --diff geofuse/ tests/ scripts/ ui/

      # Errors fail the job: undefined names, unused imports and variables,
      # syntax errors.
      - name: Ruff errors
        id: ruff_errors
        continue-on-error: true
        run: ruff check --select F,E9 geofuse/ tests/ scripts/ ui/

      # Everything else in pyproject.toml is reported but does not fail.
      - name: Ruff warnings (report only)
        id: ruff_all
        continue-on-error: true
        run: ruff check --statistics geofuse/ tests/ scripts/ ui/

      - name: Summary
        if: always()
        env:
          BLACK: ${{ steps.black.outcome }}
          ISORT: ${{ steps.isort.outcome }}
          RUFF_ERRORS: ${{ steps.ruff_errors.outcome }}
          RUFF_ALL: ${{ steps.ruff_all.outcome }}
        run: |
          mark() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## Code Quality Results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Black formatting | $(mark "$BLACK") $BLACK |"
            echo "| isort import order | $(mark "$ISORT") $ISORT |"
            echo "| Ruff errors (F, E9) | $(mark "$RUFF_ERRORS") $RUFF_ERRORS |"
            echo "| Ruff warnings (report only) | $([ "$RUFF_ALL" = "success" ] && echo "✅" || echo "⚠️") $RUFF_ALL |"
            echo ""
            echo "### To fix formatting locally"
            echo '```bash'
            echo "black geofuse/ tests/ scripts/ ui/"
            echo "isort geofuse/ tests/ scripts/ ui/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on formatting or Ruff errors
        if: steps.black.outcome != 'success' || steps.isort.outcome != 'success' || steps.ruff_errors.outcome != 'success'
        run: |
          echo "::error::Black: ${{ steps.black.outcome }}, isort: ${{ steps.isort.outcome }}, Ruff errors: ${{ steps.ruff_errors.outcome }}"
          exit 1
