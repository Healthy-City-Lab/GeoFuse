name: Installation & Test Suite

on:
  # Manual triggering only
  workflow_dispatch:

jobs:
  prepare-models:
    name: Download and Cache Models
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PyTorch Hub models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: torch-hub-models

      - name: Cache model weights
        id: cache-model
        uses: actions/cache@v4
        with:
          path: geofuse/model/best_model.pth
          key: model-weights-resnet101-v1

      - name: Download model weights
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p geofuse/model
          
          # Hardcoded model URL
          MODEL_URL="https://drive.google.com/file/d/1t7TC8mxQaFECt4jutdq_NMnWxdm6B-Nb/view"
          
          echo "Downloading model weights..."
          
          if [[ "$MODEL_URL" == *"drive.google.com"* ]] || [[ "$MODEL_URL" == *"docs.google.com"* ]]; then
            echo "Detected Google Drive link - using gdown"
            pip install gdown -q
            gdown "$MODEL_URL" -O geofuse/model/best_model.pth --fuzzy
          else
            echo "Using direct download with curl"
            curl -L "$MODEL_URL" -o geofuse/model/best_model.pth
          fi
          
          echo "Verifying downloaded file..."
          ls -lh geofuse/model/best_model.pth
          
          echo "Model downloaded successfully"
          ls -lh geofuse/model/

  test-installation:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare-models
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash -el {0}  # Use bash with error handling for all platforms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache model weights
        id: cache-model
        uses: actions/cache@v4
        with:
          path: geofuse/model/best_model.pth
          key: model-weights-resnet101-v1

      - name: Download model weights if not cached
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "📥 Downloading model weights..."
          mkdir -p geofuse/model
          
          MODEL_URL="https://drive.google.com/file/d/1t7TC8mxQaFECt4jutdq_NMnWxdm6B-Nb/view"
          
          pip install gdown -q
          gdown "$MODEL_URL" -O geofuse/model/best_model.pth --fuzzy
      
      - name: Verify model exists
        shell: python
        run: |
          import os
          import sys
          model_path = "geofuse/model/best_model.pth"
          if os.path.exists(model_path):
            size_mb = os.path.getsize(model_path) / (1024*1024)
            print(f"✅ Model found: {size_mb:.1f} MB")
          else:
            print(f"❌ Model not found at {model_path}")
            sys.exit(1)

      - name: Cache conda packages
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-v1

      - name: Verify conda cache
        shell: python
        run: |
          import os
          cache_dir = os.path.expanduser("~/conda_pkgs_dir")
          if os.path.exists(cache_dir):
            file_count = len([f for f in os.listdir(cache_dir)]) if os.path.isdir(cache_dir) else 0
            print(f"✅ Conda cache (${{ runner.os }}): {file_count} packages")
          else:
            print("ℹ️ Conda cache empty - will be populated during install")

      - name: Cache PyTorch Hub models
        id: cache-torch
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: torch-hub-models-v1

      - name: Verify PyTorch Hub cache
        shell: python
        run: |
          import os
          cache_dir = os.path.expanduser("~/.cache/torch/hub")
          if os.path.exists(cache_dir):
            subdirs = [d for d in os.listdir(cache_dir) if os.path.isdir(os.path.join(cache_dir, d))] if os.path.isdir(cache_dir) else []
            print(f"✅ PyTorch Hub cache: {len(subdirs)} models")
          else:
            print("ℹ️ PyTorch Hub cache empty - will download ResNet101 on first use")

      - name: Set up Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate-base: true
          use-mamba: true
          conda-remove-defaults: true  # Suppress defaults channel warning

      - name: Install mamba in base (for faster installs)
        run: |
          conda install mamba -n base -c conda-forge -y

      - name: Remove existing environment (if any)
        run: |
          conda env remove -n geofuse -y || true
          echo "Fresh environment will be created"

      - name: Make installer executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x install.sh

      - name: Run installer (Unix)
        if: runner.os != 'Windows'
        run: ./install.sh
        continue-on-error: false

      - name: Run installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: install.bat
        continue-on-error: false

      - name: Run Logic Tests (Offline)
        run: |
          conda run -n geofuse python tests/test_pipeline.py
        continue-on-error: false

      - name: Run Memory Stability Test (Short)
        run: |
          conda run -n geofuse python tests/test_memory_stability.py --iterations 20
        continue-on-error: true

      - name: Check installation log
        if: always()
        run: |
          if [ -f "logs/install.log" ]; then
            echo "=== Last 50 lines of installation log ==="
            tail -n 50 logs/install.log
          else
            echo "No installation log found"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/output/**/*.png
            tests/output/**/*.geojson
            logs/install.log
          retention-days: 7

      - name: Cleanup environment
        if: always()
        run: |
          conda env remove -n geofuse -y || true
          echo "Environment cleaned up"