name: Installation & Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.bat'
      - 'scripts/setup_env.py'
      - 'pyproject.toml'
      - '.github/workflows/setup-tests.yml'
  # Weekly, to catch upstream changes (yanked packages, retired wheels)
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_PATH: geofuse/model/best_model.pth
  MODEL_DRIVE_ID: 1t7TC8mxQaFECt4jutdq_NMnWxdm6B-Nb
  # Saved from Linux, restored on every OS (enableCrossOsArchive)
  MODEL_CACHE_KEY: model-weights-resnet101-v2

jobs:
  prepare-models:
    name: Download and Cache Models
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Cache model weights
        id: cache-model
        uses: actions/cache@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: ${{ env.MODEL_CACHE_KEY }}
          enableCrossOsArchive: true

      - name: Download model weights
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          pip install gdown -q
          for attempt in 1 2 3; do
            gdown "$MODEL_DRIVE_ID" -O "$MODEL_PATH" && break
            echo "Download attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          test -s "$MODEL_PATH"
          ls -lh "$MODEL_PATH"

  test-installation:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare-models
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU build keeps the Linux runner within its disk space; Windows
          # installs the CUDA build users get; macOS has only the one build.
          - os: ubuntu-latest
            torch: cpu
          - os: windows-latest
            torch: auto
          - os: macos-latest
            torch: auto

    # conda/mamba keep downloaded packages in the cached directory. PYTHONUTF8
    # forces UTF-8 stdout so mamba's progress output cannot crash the installer
    # on Windows (default console encoding is cp1252).
    env:
      CONDA_PKGS_DIRS: ~/conda_pkgs_dir
      PIP_CACHE_DIR: ~/pip_cache
      PYTHONUTF8: "1"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── Model weights ────────────────────────────────────────────────
      - name: Restore model weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: ${{ env.MODEL_CACHE_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # ── Package caches (keyed on the installer's pins) ───────────────
      - name: Cache conda packages
        uses: actions/cache@v6
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('scripts/setup_env.py') }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/pip_cache
          key: pip-${{ runner.os }}-${{ matrix.torch }}-${{ hashFiles('scripts/setup_env.py') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.torch }}-

      # ── Conda ────────────────────────────────────────────────────────
      - name: Set up Conda (Miniforge + mamba)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true
          use-mamba: true
          conda-remove-defaults: true

      # ── Install ──────────────────────────────────────────────────────
      - name: Run installer (Unix)
        if: runner.os != 'Windows'
        run: bash install.sh --yes --torch ${{ matrix.torch }}

      - name: Run installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: install.bat --yes --torch ${{ matrix.torch }}

      # ── Tests ────────────────────────────────────────────────────────
      - name: Readiness check (offline)
        run: |
          conda activate geofuse
          geofuse doctor --offline || echo "::notice::geofuse doctor reports items not ready (expected without sign-ins)"

      - name: Run logic tests (offline)
        run: |
          conda activate geofuse
          python tests/test_pipeline.py

      - name: Run unit tests (settings, plans, Bayesian index)
        run: |
          conda activate geofuse
          python -m pytest -q -p no:cacheprovider tests/test_settings.py tests/test_plans.py tests/test_bayesian_index.py

      - name: Run memory stability test (short)
        run: |
          conda activate geofuse
          python tests/test_memory_stability.py --iterations 20 \
            || echo "::warning::Memory stability test failed on ${{ matrix.os }}"

      # ── Diagnostics & artefacts ──────────────────────────────────────
      - name: Show installation log on failure
        if: failure()
        run: |
          if [ -f "logs/install.log" ]; then
            echo "=== Last 120 lines of installation log ==="
            tail -n 120 logs/install.log
          else
            echo "No installation log found"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/output/**/*.png
            tests/output/**/*.geojson
            logs/install.log
          if-no-files-found: ignore
          retention-days: 30
